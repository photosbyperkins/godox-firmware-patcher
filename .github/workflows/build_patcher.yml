name: Build Firmware Patcher (Windows & macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: GodoxFirmwarePatcher-Windows-x64
          - os: macos-latest
            artifact_name: GodoxFirmwarePatcher-macOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2

      - name: Build standalone executable / .app bundle
        run: python tools/build_executable.py

      - name: Package macOS .app into .zip (preserving bundle permissions & symlinks)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GodoxFirmwarePatcher.app GodoxFirmwarePatcher-macOS.zip

      - name: Upload Windows .exe Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/GodoxFirmwarePatcher.exe

      - name: Upload macOS .app Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/GodoxFirmwarePatcher-macOS.zip
